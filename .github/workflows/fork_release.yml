# 本分支（AI 版）的发布流程。
# 上游 build_release.yml 依赖上游仓库的标签与签名密钥，在分支仓库中无法完成发布，
# 因此这里复用上游的 NUKE 构建与打包脚本，构建 Windows x64 包并发布到本仓库的 Release（未签名）。
name: Fork Release

on:
  push:
    branches: [ ccr-e15fb9f5-bv83x8 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: true

env:
  PDC_CLIENT_VERSION: 1.0.1.0
  RELEASE_TAG: 2.1.2.0

jobs:
  build_app:
    runs-on: windows-2022
    strategy:
      fail-fast: true
      matrix:
        build_type: [ 'full', 'selfContained' ]
    name: Build_AppBase_windows_x64_${{ matrix.build_type }}_folder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 构建脚本通过 git describe 读取版本号，分支仓库没有上游标签，在本地打上发布标签。
      - name: Tag version locally
        run: git tag -f ${{ env.RELEASE_TAG }}

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: ☢️ Nuke
        env:
          buildType: ${{ matrix.build_type }}
          package: folder
          arch: x64
          osName: windows
          appVersion: ${{ env.RELEASE_TAG }}
          buildName: appBase
        run: pwsh -ep bypass ./build.ps1 PublishApp

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: out_appBase_windows_x64_${{ matrix.build_type }}_folder
          path: ./out/*.zip

  build_launcher:
    runs-on: windows-2022
    name: Build_Launcher_windows_x64_aot_singleFile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Tag version locally
        run: git tag -f ${{ env.RELEASE_TAG }}

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: ☢️ Nuke
        env:
          buildType: aot
          package: singleFile
          arch: x64
          osName: windows
          buildName: launcher
        run: pwsh -ep bypass ./build.ps1 PublishLauncher

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: out_launcher_windows_x64_aot_singleFile
          path: ./out/*.zip

  pack_app:
    runs-on: windows-2022
    needs: [ build_app, build_launcher ]
    strategy:
      matrix:
        include:
          - build_type: full
            package: folder
          - build_type: selfContained
            package: folder
          - build_type: selfContained
            package: installer
    env:
      artifact_name: ClassIsland-AI_2.1.2.0_windows_x64_${{ matrix.build_type }}_${{ matrix.package }}
    name: Pack_App_windows_x64_${{ matrix.build_type }}_${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Tag version locally
        run: git tag -f ${{ env.RELEASE_TAG }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts

      - name: Combine artifacts
        run: pwsh -ep bypass ./tools/release-gen/combine-artifacts.ps1

      - name: Generate package
        env:
          package: ${{ matrix.package }}
          arch: x64
          osName: windows
          buildType: ${{ matrix.build_type }}
        run: pwsh -ep bypass ./tools/release-gen/pack/entry.ps1

      - name: Compile installer
        if: ${{ matrix.package == 'installer' }}
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./installer/setup.iss
          options: |
            /DAppVersion=${{ env.RELEASE_TAG }}
            /FClassIsland-AI_${{ env.RELEASE_TAG }}_windows_x64_setup
            /O${{ github.workspace }}\out_pack
            /DSourceDir=${{ github.workspace }}\out_pack\pack
            /DArch=x64

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ${{ github.workspace }}/out_pack/*.zip
            ${{ github.workspace }}/out_pack/*.exe

  release:
    runs-on: ubuntu-24.04
    needs: [ pack_app ]
    name: Publish Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 将发布标签指向本次构建的提交（重复构建时更新标签）。
      - name: Push release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$RELEASE_TAG" -m "ClassIsland AI 版 $RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: ClassIsland-AI_*
          path: ./release_files
          merge-multiple: true

      - name: List files
        run: ls -la ./release_files

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ClassIsland AI 版 ${{ env.RELEASE_TAG }}
          bodyFile: ./.github/fork_release_notes.md
          artifacts: ./release_files/*
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
